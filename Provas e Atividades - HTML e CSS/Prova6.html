<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova 6</title>

    <style>
        
        body {
            font-family: sans-serif;
            background-color: rgb(226, 221, 221);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /*Formulário*/
        form {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%; 
            max-width: 400px; 
        }

        /*HUD*/
        .grupos {
            margin-bottom: 20px;
            position: relative; 
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: calc(100% - 30px); 
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            padding-left: 35px; 
        }

        .grupos::before {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.7;
        }

        /*Botões*/
        .botão {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }

        button[type="submit"] {
            background-color: #5cb85c;
        }

        button[type="reset"] {
            background-color: #f0ad4e;
        }

        button:hover::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: inherit;
        }

        button {
            position: relative; 
            overflow: hidden; 
        }

        /*Resolução da tela*/
        @media (min-width: 768px) {
            form {
                width: 80%;
                max-width: 500px;
            }
        }

        @media (min-width: 992px) {
            form {
                max-width: 600px;
            }
        }
    </style>

</head>
<body>

    <form>

        <!--Nome-->
        <div class="grupos">
            <label for="username">Nome de Usuário:</label>
            <input type="text" id="username" name="username" required>
        </div>

        <!--Senha-->
        <div class="grupos">
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
        </div>

        <!--Botões-->
        <div class="botão">
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </div>

    </form>

</body>
</html>
