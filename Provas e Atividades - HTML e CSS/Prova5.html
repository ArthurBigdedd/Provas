<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova 5</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;   
            min-height: 35rem;     
        }

        .contêiner {
            display: flex;             
            justify-content: center;   
            align-items: center;       
            background-color: #ddd;
            padding: 20px;
            border-radius: 5px;
        }

        .caixa {
            background-color: #6cb3e8;
            color: white;
            width: 100px;
            height: 100px;
            margin: 10px;
            display: flex;            
            justify-content: center;
            align-items: center;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    
    <div class="contêiner">
        <div class="caixa">A</div>
        <div class="caixa">B</div>
        <div class="caixa">C</div>
    </div>

</body>
</html>
